<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="やることノート">
<meta name="application-name" content="やることノート">
<title>やることノート</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
:root{
  --bg:#14161A;
  --surface:#1C2027;
  --surface-2:#242932;
  --line:#2E3440;
  --line-soft:#232830;
  --text:#E8EBF0;
  --dim:#98A0AE;
  --faint:#6B7382;
  --accent:#7FB2E5;
  --accent-soft:rgba(127,178,229,.14);
  --amber:#E0A94A;
  --coral:#E8796B;
  --c1:#B694F5; --c2:#5FC9A0; --c3:#F0A05A; --c4:#EE8CA8;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI",YuGothic,"Yu Gothic","Noto Sans JP",Meiryo,system-ui,sans-serif;
  --gap:8px;
}
*{box-sizing:border-box}
html{background:#14161A;overscroll-behavior-y:none}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--gothic);font-size:16px;line-height:1.6;
  color-scheme:dark;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- top ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(20,22,26,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-in{
  max-width:720px;margin:0 auto;
  padding:10px 20px 0;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:calc(20px + env(safe-area-inset-left,0px));
  padding-right:calc(20px + env(safe-area-inset-right,0px));
}
.top-row{display:flex;align-items:baseline;gap:12px}
.brand{
  font-family:var(--mincho);font-size:17px;font-weight:600;letter-spacing:.06em;margin:0;
}
.today-label{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.overbar{
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  background:var(--coral);color:#231010;border-radius:999px;padding:3px 11px;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  box-shadow:0 0 0 0 rgba(232,121,107,.5);
  animation:overPulse 2.6s ease-out infinite;
}
.overbar[hidden]{display:none}
@keyframes overPulse{
  0%{box-shadow:0 0 0 0 rgba(232,121,107,.45)}
  55%{box-shadow:0 0 0 7px rgba(232,121,107,0)}
  100%{box-shadow:0 0 0 0 rgba(232,121,107,0)}
}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.iconbtn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim);
  transition:background .15s,color .15s;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{
  position:relative;padding:8px 2px 10px;margin-right:16px;font-size:13.5px;color:var(--faint);
  display:inline-flex;align-items:center;gap:6px;transition:color .15s;
}
.tab:hover{color:var(--dim)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);
}
.tab .n{
  font-size:11px;color:var(--faint);background:var(--surface-2);border-radius:999px;padding:1px 7px;
  font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.tab .n.warn,.tab[aria-selected="true"] .n.warn{background:rgba(232,121,107,.2);color:#FF9E92}
.searchwrap{display:none;padding:0 0 10px}
.searchwrap.on{display:block}
.searchwrap input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14px;
}
.searchwrap input:focus{outline:none;border-color:var(--accent)}

/* ---------- layout ---------- */
.wrap{
  max-width:720px;margin:0 auto;
  padding:18px 20px 120px;
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
  padding-left:calc(20px + env(safe-area-inset-left,0px));
  padding-right:calc(20px + env(safe-area-inset-right,0px));
}
.warn{
  margin-bottom:14px;padding:11px 14px;border-radius:10px;
  background:rgba(232,121,107,.09);border:1px solid rgba(232,121,107,.35);
  color:#FFB3A8;font-size:12.5px;line-height:1.7;
}

/* ---------- compose ---------- */
.compose{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:4px 4px 4px 14px;transition:border-color .2s;
}
.compose:focus-within{border-color:#3A4250}
.compose-row{display:flex;align-items:center;gap:8px}
.compose input.title{flex:1 1 auto;min-width:0;background:none;border:0;padding:12px 0;font-size:16px}
.compose input.title::placeholder{color:var(--faint)}
.compose input.title:focus{outline:none}
.addbtn{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#0E1620;
  display:grid;place-items:center;transition:transform .12s,filter .15s;
}
.addbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.addbtn:active{transform:scale(.93)}
.addbtn:disabled{background:var(--surface-2);color:var(--faint);cursor:default}
.opts{display:none;flex-wrap:wrap;gap:6px;padding:2px 10px 8px 0;align-items:center}
.compose.is-open .opts{display:flex}
.opts .sep{width:1px;height:16px;background:var(--line);margin:0 3px}
.pill{
  font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.pill:hover{border-color:#3A4250;color:var(--text)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:rgba(127,178,229,.45);color:var(--accent)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.date{padding:0;border:0}
.pill.date input{font-size:12px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim)}

/* ---------- groups ---------- */
.group{margin-top:22px}
.group-h{
  display:flex;align-items:center;gap:10px;margin-bottom:9px;
  font-size:11.5px;letter-spacing:.08em;color:var(--faint);
}
.group-h .rule{flex:1 1 auto;height:1px;background:var(--line-soft)}
.group-h .n{font-variant-numeric:tabular-nums}
.group-h.overdue{color:var(--coral)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--gap)}

/* ---------- task ---------- */
.task{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:11px;
  padding:12px 8px 12px 13px;
  transition:border-color .15s,opacity .18s,transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s;
}
.task:hover{border-color:var(--line)}
.task.is-open{border-color:var(--accent);background:var(--surface-2)}
.task.over{
  border-left:3px solid var(--coral);padding-left:10px;
  background:linear-gradient(90deg,rgba(232,121,107,.07),rgba(232,121,107,0) 55%),var(--surface);
}
.task.over[data-lv="2"]{
  border-left-width:4px;padding-left:9px;
  background:linear-gradient(90deg,rgba(232,121,107,.12),rgba(232,121,107,0) 62%),var(--surface);
}
.task.over[data-lv="3"]{
  border-left-width:5px;padding-left:8px;border-color:var(--coral);
  background:linear-gradient(90deg,rgba(232,121,107,.18),rgba(232,121,107,0) 70%),var(--surface);
}
.badge-over{
  display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;
  background:rgba(232,121,107,.16);color:#FF9E92;border:1px solid rgba(232,121,107,.5);
  border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums;
}
.task.over[data-lv="3"] .badge-over{background:var(--coral);color:#231010;border-color:transparent}
.task.dragging{
  z-index:5;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.45);
  border-color:var(--accent);transition:none;cursor:grabbing;
}
.task.leaving{opacity:0;transform:translateX(12px)}
.task.entering{animation:rowIn .26s cubic-bezier(.22,1,.36,1)}
@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.check{
  flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:7px;
  border:1.8px solid #414B5C;display:grid;place-items:center;
  transition:border-color .15s,background .15s,transform .1s;
}
.check:hover{border-color:var(--accent)}
.check:active{transform:scale(.9)}
.check svg{width:13px;height:13px;stroke:#0E1620;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task.done .check svg{opacity:1}
.t-body{flex:1 1 auto;min-width:0;cursor:pointer}
.t-title{display:block;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.task.done .t-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
.t-memo{
  display:block;margin-top:3px;font-size:12px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:5px;font-size:11.5px;color:var(--faint)}
.t-meta .m{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.t-meta .dot{width:7px;height:7px;border-radius:50%}
.t-meta .due-over{color:var(--coral)}
.t-meta .due-today{color:var(--amber)}
.handle{
  flex:0 0 auto;width:30px;align-self:stretch;display:grid;place-items:center;color:#4C5666;
  cursor:grab;touch-action:none;transition:color .15s;
}
.handle:hover{color:var(--accent)}
.handle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.list[data-drag="0"] .handle{display:none}

/* ---------- detail ---------- */
.detail{
  background:var(--surface-2);border:1px solid var(--accent);border-top:0;
  border-radius:0 0 11px 11px;margin-top:-11px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:12px;
}
.detail input.dt-title{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;
}
.detail textarea{
  width:100%;min-height:76px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:13.5px;line-height:1.7;resize:vertical;font-family:inherit;
}
.detail input:focus,.detail textarea:focus{outline:none;border-color:var(--accent)}
.detail .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.detail .lbl{font-size:11px;letter-spacing:.08em;color:var(--faint);width:100%;margin-bottom:-2px}
.detail .foot{display:flex;gap:8px;align-items:center;padding-top:2px}
.txtbtn{font-size:12.5px;color:var(--dim);padding:7px 12px;border-radius:8px;border:1px solid var(--line)}
.txtbtn:hover{border-color:#3A4250;color:var(--text)}
.txtbtn.danger:hover{border-color:var(--coral);color:var(--coral)}
.txtbtn.primary{margin-left:auto;background:var(--accent-soft);border-color:rgba(127,178,229,.4);color:var(--accent)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--faint);border:1px dashed var(--line);border-radius:12px;margin-top:22px}
.empty p{margin:0;font-size:14px;font-family:var(--mincho);letter-spacing:.04em}
.empty .sub{margin-top:12px;font-size:12.5px;font-family:var(--gothic)}
.empty .link{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- done section ---------- */
.done-sec{margin-top:28px}
.done-sec summary{
  list-style:none;cursor:pointer;font-size:11.5px;letter-spacing:.08em;color:var(--faint);
  display:flex;align-items:center;gap:10px;padding:6px 0;
}
.done-sec summary::-webkit-details-marker{display:none}
.done-sec summary > span{white-space:nowrap}
.done-sec summary::after{content:"";order:2;flex:1 1 auto;height:1px;background:var(--line-soft)}
.done-sec .list{margin-top:8px}
.done-sec .task{background:transparent;border-style:dashed}

/* ---------- settings ---------- */
.settings{margin-top:34px;border-top:1px solid var(--line-soft);padding-top:12px}
.settings summary{list-style:none;cursor:pointer;font-size:11.5px;letter-spacing:.08em;color:var(--faint);padding:6px 0}
.settings summary::-webkit-details-marker{display:none}
.settings-body{display:flex;flex-direction:column;gap:18px;padding:14px 0 0;font-size:13px;color:var(--dim)}
.field{display:flex;flex-direction:column;gap:8px}
.field > label{font-size:11px;letter-spacing:.09em;color:var(--faint)}
.cat-edit{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat-edit div{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:7px 10px}
.cat-edit input{background:none;border:0;width:100%;font-size:13px}
.cat-edit input:focus{outline:none}
.cat-edit .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
.data-row{display:flex;flex-wrap:wrap;gap:8px}
.settings textarea{
  width:100%;min-height:80px;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;
  padding:10px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;resize:vertical;
}
.note{font-size:11.5px;color:var(--faint);line-height:1.8}
.kbd{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--dim);
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:80;
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:9px 10px 9px 18px;font-size:12.5px;color:var(--text);
  box-shadow:0 10px 34px rgba(0,0,0,.55);display:flex;align-items:center;gap:12px;max-width:92vw;
}
.toast button{
  font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 13px;white-space:nowrap;
}

@media (max-width:640px){
  .topbar-in{
    padding:10px 16px 0;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
    padding-left:calc(16px + env(safe-area-inset-left,0px));
    padding-right:calc(16px + env(safe-area-inset-right,0px));
  }
  .wrap{
    padding:16px 16px 120px;
    padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
    padding-left:calc(16px + env(safe-area-inset-left,0px));
    padding-right:calc(16px + env(safe-area-inset-right,0px));
  }
  .tab{margin-right:12px}
  .cat-edit{grid-template-columns:1fr}
  .check{width:26px;height:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="top-row">
      <h1 class="brand">やることノート</h1>
      <span class="today-label" id="todayLabel"></span>
      <button class="overbar" id="overBar" type="button" hidden></button>
      <div class="top-actions">
        <button class="iconbtn" id="searchBtn" type="button" aria-pressed="false" aria-label="検索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="iconbtn" id="undoBtn" type="button" aria-label="元に戻す">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12H8"/></svg>
        </button>
      </div>
    </div>
    <div class="searchwrap" id="searchWrap">
      <input id="searchInput" type="search" placeholder="タスクとメモを検索" autocomplete="off">
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="today" aria-selected="true">今日 <span class="n" id="nToday">0</span></button>
      <button class="tab" role="tab" data-view="plan" aria-selected="false">予定 <span class="n" id="nPlan">0</span></button>
      <button class="tab" role="tab" data-view="all" aria-selected="false">すべて <span class="n" id="nAll">0</span></button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="warnSlot"></div>

  <form class="compose" id="compose" autocomplete="off">
    <div class="compose-row">
      <input class="title" id="newTitle" placeholder="やることを書く" maxlength="200" aria-label="やること">
      <button class="addbtn" id="addBtn" type="submit" disabled aria-label="追加">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="opts" id="opts"></div>
  </form>

  <div id="board"></div>

  <details class="done-sec" id="doneSec">
    <summary><span id="doneLabel">完了したもの</span></summary>
    <ul class="list" id="doneList" data-drag="0"></ul>
  </details>

  <details class="settings">
    <summary>設定とデータ</summary>
    <div class="settings-body">
      <div class="field">
        <label>カテゴリの名前</label>
        <div class="cat-edit" id="catEdit"></div>
      </div>

      <div class="field" id="fileBackup">
        <label>バックアップ（ファイル）</label>
        <div class="data-row">
          <button class="txtbtn" id="saveFileBtn" type="button">ファイルに保存</button>
          <button class="txtbtn" id="loadFileBtn" type="button">ファイルから復元</button>
          <input type="file" id="fileInput" accept="application/json,.json" hidden>
          <button class="txtbtn danger" id="resetBtn" type="button">すべて消す</button>
        </div>
      </div>

      <details class="field">
        <summary style="font-size:11px;letter-spacing:.09em;color:var(--faint);cursor:pointer;list-style:none">コピー＆ペーストで移す</summary>
        <div class="data-row" style="margin-top:10px">
          <button class="txtbtn" id="exportBtn" type="button">書き出す</button>
          <button class="txtbtn" id="importBtn" type="button">読み込む</button>
        </div>
        <textarea id="dataArea" placeholder="「書き出す」でここにデータが出ます。別の端末ではこの中身を貼り付けて「読み込む」。"></textarea>
      </details>

      <p class="note">
        一度開けば、あとは機内モードでも起動します。データはこの端末の中だけに保存され、どこにも送信されません。<br>
        完了したタスクは30日たつと自動で片づきます。<br>
        キーボード: <span class="kbd">N</span> 新規 ・ <span class="kbd">/</span> 検索 ・ <span class="kbd">Ctrl+Z</span> 元に戻す ・ <span class="kbd">Esc</span> 閉じる
      </p>
    </div>
  </details>
</main>

<script>
(function () {
  "use strict";

  var KEY = "todonote.v1";
  var OLD_KEY = "questlog.v1";
  var CAT_COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)"];
  var GAP = 8;

  var S = {
    tasks: [],
    cats: ["仕事", "生活", "学び", "健康"],
    view: "today",
    catFilter: null
  };
  var draft = { cat: null, due: null };
  var query = "";
  var openId = null;
  var history = [];
  var storageOK = true;

  /* ---------- storage ---------- */
  function load() {
    var raw = null;
    try {
      localStorage.setItem(KEY + ".probe", "1");
      localStorage.removeItem(KEY + ".probe");
      raw = localStorage.getItem(KEY);
    } catch (e) { storageOK = false; }
    if (raw) {
      try {
        var d = JSON.parse(raw);
        if (Array.isArray(d.tasks)) S.tasks = d.tasks;
        if (Array.isArray(d.cats) && d.cats.length === 4) S.cats = d.cats;
        if (typeof d.view === "string") S.view = d.view;
      } catch (e) { /* 壊れていたら初期状態 */ }
      normalize();
      return;
    }
    if (!migrate()) seed();
    normalize();
  }
  function migrate() {
    var raw = null;
    try { raw = localStorage.getItem(OLD_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try {
      var d = JSON.parse(raw);
      if (!Array.isArray(d.tasks) || !d.tasks.length) return false;
      if (Array.isArray(d.cats) && d.cats.length === 4) S.cats = d.cats;
      S.tasks = d.tasks.map(function (t, i) {
        return {
          id: uid(), title: String(t.title || "").slice(0, 200), memo: "",
          cat: (typeof t.cat === "number" ? t.cat : null),
          due: t.due || null, done: !!t.done,
          createdAt: t.createdAt || Date.now(), completedAt: t.completedAt || null,
          order: i
        };
      });
      save();
      setTimeout(function () { toast("前のアプリのタスクを引き継ぎました。"); }, 600);
      return true;
    } catch (e) { return false; }
  }
  function seed() {
    var n = Date.now();
    S.tasks = [
      { id: uid(), title: "行をタップすると、名前・メモ・期限を直せます", memo: "ここがメモ欄です。買うものや手順、リンクなどを書いておけます。", cat: null, due: today(), done: false, createdAt: n, completedAt: null, order: 0 },
      { id: uid(), title: "右端の持ち手をつまむと順番を入れ替えられます", memo: "", cat: 0, due: today(), done: false, createdAt: n + 1, completedAt: null, order: 1 },
      { id: uid(), title: "消してしまっても、左上の矢印で元に戻せます", memo: "", cat: null, due: null, done: false, createdAt: n + 2, completedAt: null, order: 2 }
    ];
  }
  function normalize() {
    var limit = Date.now() - 30 * 864e5;
    S.tasks = S.tasks.filter(function (t) { return t && !(t.done && (t.completedAt || 0) < limit); });
    S.tasks.forEach(function (t, i) {
      if (typeof t.order !== "number") t.order = i;
      if (typeof t.memo !== "string") t.memo = "";
    });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { storageOK = false; showWarn(); }
  }
  function showWarn() {
    var slot = document.getElementById("warnSlot");
    if (!slot || slot.firstChild) return;
    slot.innerHTML = '<div class="warn">このブラウザでは自動保存ができません（プライベートモードか、保存が制限されています）。' +
      'タブを閉じると内容が消えるので、設定の「ファイルに保存」でバックアップを取ってください。</div>';
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  /* ---------- undo ---------- */
  function snapshot(label) {
    history.push({ label: label, tasks: JSON.parse(JSON.stringify(S.tasks)) });
    if (history.length > 40) history.shift();
    updateUndo();
  }
  function undo() {
    var h = history.pop();
    if (!h) { toast("元に戻せる操作はありません。"); return; }
    S.tasks = h.tasks;
    openId = null;
    save(); render();
    toast("「" + h.label + "」を元に戻しました。");
    updateUndo();
  }
  function updateUndo() {
    var b = $("undoBtn");
    b.disabled = !history.length;
    b.style.opacity = history.length ? "1" : ".35";
  }

  /* ---------- dates ---------- */
  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { return ymd(new Date()); }
  function shift(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  function endOfWeek() {
    var d = new Date(), wd = d.getDay();
    d.setDate(d.getDate() + ((7 - wd) % 7));
    return ymd(d);
  }
  function dueInfo(due) {
    if (!due) return null;
    var t = today();
    if (due < t) {
      var n = daysOver(due);
      return { cls: "due-over", over: n, lv: n >= 7 ? 3 : (n >= 3 ? 2 : 1), text: n + "日超過" };
    }
    if (due === t) return { cls: "due-today", over: 0, text: "今日" };
    if (due === shift(1)) return { cls: "", over: 0, text: "明日" };
    return { cls: "", over: 0, text: fmtDate(due) };
  }
  function daysOver(due) {
    var a = new Date(due + "T00:00:00").getTime();
    var b = new Date(today() + "T00:00:00").getTime();
    return Math.max(1, Math.round((b - a) / 864e5));
  }
  function fmtDate(due) {
    var p = due.split("-");
    return Number(p[1]) + "/" + Number(p[2]);
  }

  /* ---------- helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function find(id) {
    for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === id) return S.tasks[i];
    return null;
  }
  function byOrder(a, b) { return a.order - b.order; }
  function open_() { return S.tasks.filter(function (t) { return !t.done; }); }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg, actionLabel, fn) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = "<span>" + esc(msg) + "</span>";
    if (actionLabel) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = actionLabel;
      b.addEventListener("click", function () { el.remove(); fn(); });
      el.appendChild(b);
    }
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, actionLabel ? 6000 : 2600);
  }

  /* ---------- icons ---------- */
  var ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';
  var ICON_GRIP = '<svg viewBox="0 0 24 24"><path d="M9 7h.01M15 7h.01M9 12h.01M15 12h.01M9 17h.01M15 17h.01"/></svg>';

  /* ---------- render ---------- */
  function taskHTML(t) {
    var di = dueInfo(t.due);
    var isOver = !t.done && di && di.over > 0;
    var cls = "task" + (t.done ? " done" : "") + (t.id === openId ? " is-open" : "") + (isOver ? " over" : "");
    var meta = [];
    if (t.cat !== null && t.cat !== undefined && S.cats[t.cat]) {
      meta.push('<span class="m"><span class="dot" style="background:' + CAT_COLORS[t.cat] + '"></span>' + esc(S.cats[t.cat]) + "</span>");
    }
    if (di) {
      if (isOver) meta.unshift('<span class="badge-over">' + esc(di.text) + " ・ " + fmtDate(t.due) + "</span>");
      else meta.push('<span class="m ' + (t.done ? "" : di.cls) + '">' + esc(di.text) + "</span>");
    }
    var memoLine = t.memo ? '<span class="t-memo">' + esc(t.memo.split("\n")[0]) + "</span>" : "";
    return '<li class="' + cls + '"' + (isOver ? ' data-lv="' + di.lv + '"' : "") + ' data-id="' + t.id + '">' +
      '<button class="check" type="button" aria-label="' + (t.done ? "未完了に戻す" : "完了にする") + '">' + ICON_CHECK + "</button>" +
      '<div class="t-body"><span class="t-title">' + esc(t.title) + "</span>" + memoLine +
      (meta.length ? '<div class="t-meta">' + meta.join("") + "</div>" : "") + "</div>" +
      '<span class="handle" aria-hidden="true">' + ICON_GRIP + "</span></li>";
  }

  function listHTML(items, draggable) {
    return '<ul class="list" data-drag="' + (draggable ? "1" : "0") + '">' + items.map(taskHTML).join("") + "</ul>";
  }
  function groupHTML(label, items, draggable, danger) {
    if (!items.length) return "";
    return '<section class="group"><div class="group-h' + (danger ? " overdue" : "") + '">' +
      "<span>" + esc(label) + '</span><span class="n">' + items.length + '</span><span class="rule"></span></div>' +
      listHTML(items, draggable) + "</section>";
  }

  function render() {
    var t0 = today();
    var all = open_().slice().sort(byOrder);
    var overdue = all.filter(function (t) { return t.due && t.due < t0; });
    var todayList = all.filter(function (t) { return t.due === t0; });
    var dated = all.filter(function (t) { return t.due; });

    $("nToday").textContent = overdue.length + todayList.length;
    $("nPlan").textContent = dated.length;
    $("nAll").textContent = all.length;
    $("todayLabel").textContent = jpToday();
    $("nToday").classList.toggle("warn", overdue.length > 0);
    var ob = $("overBar");
    if (overdue.length) {
      var worst = overdue.reduce(function (m, t) { return Math.max(m, daysOver(t.due)); }, 0);
      ob.hidden = false;
      ob.textContent = "超過 " + overdue.length + "件・最長 " + worst + "日";
    } else {
      ob.hidden = true;
    }

    var html = "";
    if (query) {
      var q = query.toLowerCase();
      var hits = S.tasks.filter(function (t) {
        return (t.title + " " + t.memo).toLowerCase().indexOf(q) >= 0;
      }).sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.order - b.order; });
      html = hits.length
        ? groupHTML("検索結果", hits, false, false)
        : '<div class="empty"><p>「' + esc(query) + "」に一致するものはありません。</p></div>";
    } else if (S.view === "today") {
      html = groupHTML("期限切れ", overdue, true, true) + groupHTML("今日", todayList, true, false);
      if (!overdue.length && !todayList.length) {
        html = '<div class="empty"><p>今日やることはありません。</p>' +
          (all.length ? '<div class="sub">期限のない未完了が ' + all.filter(function (t) { return !t.due; }).length +
            ' 件あります。<button class="link" type="button" data-goto="all">すべてを見る</button></div>' : "") +
          "</div>";
      }
    } else if (S.view === "plan") {
      var eow = endOfWeek();
      var tomorrow = shift(1);
      html = groupHTML("期限切れ", overdue, false, true) +
        groupHTML("今日", todayList, false, false) +
        groupHTML("明日", all.filter(function (t) { return t.due === tomorrow; }), false, false) +
        groupHTML("今週", all.filter(function (t) { return t.due > tomorrow && t.due <= eow; }), false, false) +
        groupHTML("それ以降", all.filter(function (t) { return t.due > eow; }), false, false);
      if (!dated.length) html = '<div class="empty"><p>期限のあるタスクはありません。</p></div>';
    } else {
      var rest = all.filter(function (t) { return !(t.due && t.due < t0); });
      if (!all.length) {
        html = '<div class="empty"><p>やることはゼロ。いい一日を。</p></div>';
      } else if (overdue.length) {
        html = groupHTML("期限切れ", overdue, true, true) + groupHTML("そのほか", rest, true, false);
      } else {
        html = '<section class="group" style="margin-top:18px">' + listHTML(all, true) + "</section>";
      }
    }
    $("board").innerHTML = html;

    var done = S.tasks.filter(function (t) { return t.done; })
      .sort(function (a, b) { return (b.completedAt || 0) - (a.completedAt || 0); });
    $("doneLabel").textContent = "完了したもの（" + done.length + "）";
    $("doneList").innerHTML = done.map(taskHTML).join("");
    $("doneSec").style.display = done.length && !query ? "" : "none";

    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute("aria-selected", b.dataset.view === S.view ? "true" : "false");
    });

    if (openId && find(openId)) openDetail(openId);
  }

  function jpToday() {
    var d = new Date(), w = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日(" + w + ")";
  }

  /* ---------- detail ---------- */
  function closeDetail() {
    openId = null;
    var d = document.querySelector(".detail");
    if (d) d.remove();
    document.querySelectorAll(".task.is-open").forEach(function (r) { r.classList.remove("is-open"); });
  }

  function openDetail(id) {
    var existing = document.querySelector(".detail");
    if (existing) existing.remove();
    var row = document.querySelector('.task[data-id="' + id + '"]');
    var t = find(id);
    if (!row || !t) { openId = null; return; }
    openId = id;
    row.classList.add("is-open");

    var box = document.createElement("div");
    box.className = "detail";
    var cats = '<button class="pill" type="button" data-set="cat" data-val="" aria-pressed="' + (t.cat === null || t.cat === undefined) + '">なし</button>';
    S.cats.forEach(function (c, i) {
      cats += '<button class="pill" type="button" data-set="cat" data-val="' + i + '" aria-pressed="' + (t.cat === i) + '">' +
        '<span class="dot" style="background:' + CAT_COLORS[i] + '"></span>' + esc(c) + "</button>";
    });
    box.innerHTML =
      '<input class="dt-title" value="' + esc(t.title) + '" maxlength="200" aria-label="タスク名">' +
      '<textarea placeholder="メモ" aria-label="メモ">' + esc(t.memo || "") + "</textarea>" +
      '<div class="row"><span class="lbl">カテゴリ</span>' + cats + "</div>" +
      '<div class="row"><span class="lbl">期限</span>' +
      '<button class="pill" type="button" data-set="due" data-val="' + today() + '" aria-pressed="' + (t.due === today()) + '">今日</button>' +
      '<button class="pill" type="button" data-set="due" data-val="' + shift(1) + '" aria-pressed="' + (t.due === shift(1)) + '">明日</button>' +
      '<button class="pill" type="button" data-set="due" data-val="" aria-pressed="' + (!t.due) + '">なし</button>' +
      '<span class="pill date"><input type="date" value="' + (t.due || "") + '" aria-label="期限の日付"></span></div>' +
      '<div class="foot"><button class="txtbtn danger" type="button" data-act="del">削除</button>' +
      '<button class="txtbtn primary" type="button" data-act="close">閉じる</button></div>';
    row.insertAdjacentElement("afterend", box);

    var titleEl = box.querySelector(".dt-title");
    var memoEl = box.querySelector("textarea");
    var dirty = false;

    function touch() { if (!dirty) { snapshot("編集"); dirty = true; } }

    titleEl.addEventListener("input", function () {
      touch();
      t.title = titleEl.value;
      var lbl = row.querySelector(".t-title");
      if (lbl) lbl.textContent = t.title;
      save();
    });
    memoEl.addEventListener("input", function () {
      touch();
      t.memo = memoEl.value;
      save();
    });
    box.addEventListener("click", function (e) {
      var b = e.target.closest("[data-set]");
      if (b) {
        snapshot("編集");
        if (b.dataset.set === "cat") t.cat = b.dataset.val === "" ? null : Number(b.dataset.val);
        else t.due = b.dataset.val || null;
        save(); render(); noticeIfGone(t.id);
        return;
      }
      var a = e.target.closest("[data-act]");
      if (!a) return;
      if (a.dataset.act === "del") { removeTask(t); return; }
      closeDetail(); render();
    });
    box.addEventListener("change", function (e) {
      if (e.target.type !== "date") return;
      snapshot("編集");
      t.due = e.target.value || null;
      save(); render(); noticeIfGone(t.id);
    });
    if (!t.title) titleEl.focus();
  }

  /* ---------- actions ---------- */
  function noticeIfGone(id) {
    if (document.querySelector('.task[data-id="' + id + '"]')) return;
    toast("いまの表示から外れました。", "すべてを見る", function () { setView("all"); });
  }

  function toggle(t, row) {
    snapshot(t.done ? "未完了に戻す" : "完了");
    t.done = !t.done;
    t.completedAt = t.done ? Date.now() : null;
    save();
    if (t.id === openId) closeDetail();
    if (t.done && row) {
      row.classList.add("leaving");
      setTimeout(render, 170);
      toast("「" + trim(t.title) + "」を完了にしました。", "元に戻す", undo);
    } else {
      render();
    }
  }
  function removeTask(t) {
    snapshot("削除");
    S.tasks = S.tasks.filter(function (x) { return x.id !== t.id; });
    if (t.id === openId) closeDetail();
    save(); render();
    toast("「" + trim(t.title) + "」を削除しました。", "元に戻す", undo);
  }
  function trim(s) { return s.length > 14 ? s.slice(0, 14) + "…" : s; }

  function onBoardClick(e) {
    var goto = e.target.closest("[data-goto]");
    if (goto) { setView(goto.dataset.goto); return; }
    var row = e.target.closest(".task");
    if (!row) return;
    var t = find(row.dataset.id);
    if (!t) return;
    if (e.target.closest(".check")) { toggle(t, row); return; }
    if (e.target.closest(".handle")) return;
    if (openId === t.id) { closeDetail(); return; }
    closeDetail();
    openDetail(t.id);
  }
  $("board").addEventListener("click", onBoardClick);
  $("doneList").addEventListener("click", onBoardClick);

  /* ---------- drag ---------- */
  var drag = null;
  document.addEventListener("pointerdown", function (e) {
    var handle = e.target.closest(".handle");
    if (!handle) return;
    var row = handle.closest(".task");
    var list = row.parentElement;
    if (!list || list.dataset.drag !== "1") return;
    e.preventDefault();
    closeDetail();
    var rows = Array.prototype.slice.call(list.children);
    drag = {
      row: row, rows: rows, startY: e.clientY,
      index: rows.indexOf(row), target: rows.indexOf(row),
      height: row.getBoundingClientRect().height
    };
    row.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    drag.handle = handle;
    drag.pid = e.pointerId;
  });
  document.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var dy = e.clientY - drag.startY;
    drag.row.style.transform = "translateY(" + dy + "px)";
    var mid = drag.row.getBoundingClientRect().top + drag.height / 2;
    var target = drag.index;
    drag.rows.forEach(function (r, i) {
      if (r === drag.row) return;
      var rc = r.getBoundingClientRect();
      var rmid = rc.top + rc.height / 2;
      if (i < drag.index && mid < rmid) target = Math.min(target, i);
      if (i > drag.index && mid > rmid) target = Math.max(target, i);
    });
    drag.target = target;
    drag.rows.forEach(function (r, i) {
      if (r === drag.row) return;
      var sh = 0;
      if (target > drag.index && i > drag.index && i <= target) sh = -(drag.height + GAP);
      if (target < drag.index && i >= target && i < drag.index) sh = drag.height + GAP;
      r.style.transform = sh ? "translateY(" + sh + "px)" : "";
    });
  });
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    d.rows.forEach(function (r) { r.style.transform = ""; });
    d.row.classList.remove("dragging");
    if (d.target !== d.index) {
      snapshot("並べ替え");
      var ids = d.rows.map(function (r) { return r.dataset.id; });
      var moved = ids.splice(d.index, 1)[0];
      ids.splice(d.target, 0, moved);
      var orders = ids.map(function (id) { return find(id).order; }).sort(function (a, b) { return a - b; });
      ids.forEach(function (id, i) { find(id).order = orders[i]; });
      save();
    }
    render();
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  /* ---------- compose ---------- */
  var composeEl = $("compose"), titleIn = $("newTitle"), addBtn = $("addBtn"), optsEl = $("opts");
  function renderOpts() {
    var h = '<button class="pill" type="button" data-role="cat" data-val="" aria-pressed="' + (draft.cat === null) + '">なし</button>';
    S.cats.forEach(function (c, i) {
      h += '<button class="pill" type="button" data-role="cat" data-val="' + i + '" aria-pressed="' + (draft.cat === i) + '">' +
        '<span class="dot" style="background:' + CAT_COLORS[i] + '"></span>' + esc(c) + "</button>";
    });
    h += '<span class="sep"></span>';
    h += '<button class="pill" type="button" data-role="due" data-val="today" aria-pressed="' + (draft.due === today()) + '">今日</button>';
    h += '<button class="pill" type="button" data-role="due" data-val="tomorrow" aria-pressed="' + (draft.due === shift(1)) + '">明日</button>';
    h += '<span class="pill date"><input type="date" id="dueDate" aria-label="期限の日付" value="' + (draft.due || "") + '"></span>';
    optsEl.innerHTML = h;
  }
  function syncAdd() { addBtn.disabled = !titleIn.value.trim(); }
  titleIn.addEventListener("input", syncAdd);
  composeEl.addEventListener("focusin", function () { composeEl.classList.add("is-open"); });
  composeEl.addEventListener("focusout", function () {
    setTimeout(function () {
      if (!composeEl.contains(document.activeElement) && !titleIn.value.trim()) composeEl.classList.remove("is-open");
    }, 0);
  });
  optsEl.addEventListener("click", function (e) {
    var b = e.target.closest(".pill");
    if (!b || !b.dataset.role) return;
    if (b.dataset.role === "cat") draft.cat = b.dataset.val === "" ? null : Number(b.dataset.val);
    else {
      var v = b.dataset.val === "today" ? today() : shift(1);
      draft.due = draft.due === v ? null : v;
    }
    renderOpts();
    titleIn.focus();
  });
  optsEl.addEventListener("change", function (e) {
    if (e.target.id === "dueDate") { draft.due = e.target.value || null; renderOpts(); }
  });
  composeEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = titleIn.value.trim();
    if (!title) return;
    snapshot("追加");
    var minOrder = S.tasks.reduce(function (m, t) { return Math.min(m, t.order); }, 0);
    var due = draft.due;
    if (!due && S.view === "today") due = today();
    S.tasks.push({
      id: uid(), title: title, memo: "", cat: draft.cat, due: due,
      done: false, createdAt: Date.now(), completedAt: null, order: minOrder - 1
    });
    save();
    titleIn.value = "";
    draft.due = null;
    syncAdd(); renderOpts(); closeDetail(); render();
    var first = document.querySelector(".task");
    if (first) first.classList.add("entering");
    titleIn.focus();
  });

  /* ---------- views / search ---------- */
  function setView(v) {
    S.view = v; closeDetail(); save(); render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { setView(b.dataset.view); });
  });
  var searchWrap = $("searchWrap"), searchInput = $("searchInput"), searchBtn = $("searchBtn");
  function toggleSearch(on) {
    searchWrap.classList.toggle("on", on);
    searchBtn.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) searchInput.focus();
    else { searchInput.value = ""; query = ""; render(); }
  }
  searchBtn.addEventListener("click", function () { toggleSearch(!searchWrap.classList.contains("on")); });
  searchInput.addEventListener("input", function () { query = searchInput.value.trim(); closeDetail(); render(); });
  $("undoBtn").addEventListener("click", undo);
  $("overBar").addEventListener("click", function () {
    if (S.view !== "today") setView("today");
    else window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typing = tag === "INPUT" || tag === "TEXTAREA";
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); return; }
    if (typing) {
      if (e.key === "Escape") { document.activeElement.blur(); closeDetail(); render(); }
      return;
    }
    if (e.key === "/") { e.preventDefault(); toggleSearch(true); }
    else if (e.key.toLowerCase() === "n") { e.preventDefault(); titleIn.focus(); }
    else if (e.key === "Escape") { closeDetail(); render(); }
  });

  /* ---------- settings ---------- */
  function renderCatEdit() {
    $("catEdit").innerHTML = S.cats.map(function (c, i) {
      return '<div><span class="dot" style="background:' + CAT_COLORS[i] + '"></span>' +
        '<input value="' + esc(c) + '" maxlength="8" data-i="' + i + '" aria-label="カテゴリ' + (i + 1) + 'の名前"></div>';
    }).join("");
  }
  $("catEdit").addEventListener("input", function (e) {
    if (e.target.tagName !== "INPUT") return;
    var i = Number(e.target.dataset.i);
    S.cats[i] = e.target.value || "カテゴリ" + (i + 1);
    save(); renderOpts(); render();
  });

  function applyData(txt) {
    var d = JSON.parse(txt);
    if (!Array.isArray(d.tasks)) throw new Error("bad");
    snapshot("読み込み前の状態");
    S.tasks = d.tasks;
    if (Array.isArray(d.cats) && d.cats.length === 4) S.cats = d.cats;
    normalize(); save();
    renderCatEdit(); renderOpts(); closeDetail(); render();
  }
  function downloadBackup(text, name) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("バックアップを保存しました。");
  }
  $("saveFileBtn").addEventListener("click", function () {
    var text = JSON.stringify(S, null, 1);
    var name = "yarukoto-" + today() + ".json";
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name })
          .then(function () { toast("バックアップを渡しました。"); })
          .catch(function (err) { if (!err || err.name !== "AbortError") downloadBackup(text, name); });
        return;
      }
    } catch (e) { /* 共有シート非対応 */ }
    try { downloadBackup(text, name); }
    catch (e2) { toast("保存できませんでした。コピー＆ペーストをお使いください。"); }
  });
  $("loadFileBtn").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { applyData(String(reader.result)); toast("復元しました。", "元に戻す", undo); }
      catch (err) { toast("このファイルは読み込めませんでした。"); }
    };
    reader.readAsText(f);
    e.target.value = "";
  });
  $("exportBtn").addEventListener("click", function () {
    $("dataArea").value = JSON.stringify(S);
    $("dataArea").select();
    toast("書き出しました。コピーして保管してください。");
  });
  $("importBtn").addEventListener("click", function () {
    var txt = $("dataArea").value.trim();
    if (!txt) { toast("読み込むデータを貼り付けてください。"); return; }
    try { applyData(txt); toast("読み込みました。", "元に戻す", undo); }
    catch (err) { toast("データの形式が違うようです。"); }
  });
  $("resetBtn").addEventListener("click", function () {
    if (!confirm("すべてのタスクが消えます。よろしいですか？")) return;
    snapshot("すべて消す");
    S.tasks = []; closeDetail(); save(); render();
    toast("まっさらにしました。", "元に戻す", undo);
  });

  /* ---------- boot ---------- */
  load();
  renderOpts();
  renderCatEdit();
  render();
  syncAdd();
  updateUndo();
  if (!storageOK) showWarn();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
